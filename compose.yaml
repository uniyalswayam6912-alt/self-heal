
services:
  api-gateway:
    build:
      context: .
      dockerfile: backend/api_gateway/Dockerfile
    container_name: self-heal-api-gateway
    ports:
      - "8010:8000"
    restart: unless-stopped
    depends_on:
      - auth-service
      - project-task-service

  auth-service:
    build:
      context: .
      dockerfile: backend/auth_service/Dockerfile
    container_name: self-heal-auth-service
    ports:
      - "8001:8000"
    restart: unless-stopped
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your .env file}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your .env file}
    depends_on:
      db:
        condition: service_healthy

  
  project-task-service:
    build:
      context: .
      dockerfile: backend/project_task_service/Dockerfile
    container_name: self-heal-project-task-service
    ports:
      - "8002:8000"
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your .env file}
    depends_on:
      db:
        condition: service_healthy

  background-job-service:
    build:
      context: .
      dockerfile: backend/background_job_service/Dockerfile
    container_name: self-heal-background-job-service
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your .env file}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped


  background-job-worker:
    build:
      context: .
      dockerfile: backend/background_job_service/Dockerfile
    container_name: self-heal-background-job-worker
    command: ["python", "-m", "backend.background_job_service.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your .env file}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  background-job-scheduler:
    build:
      context: .
      dockerfile: backend/background_job_service/Dockerfile
    container_name: self-heal-background-job-scheduler
    command: ["python", "-m", "backend.background_job_service.scheduler"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your .env file}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: backend/notification_service/Dockerfile
    container_name: self-heal-notification-service
    ports:
      - "8007:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your .env file}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped


  db:
    image: postgres:17
    container_name: self-heal-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  
  redis:
    image: redis:7-alpine
    container_name: self-heal-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  
  
  kafka:
    image: apache/kafka:4.1.1
    container_name: self-heal-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped


volumes:
  postgres_data:
  redis_data:
  kafka_data:
