
services:
  api-gateway:
    build:
      context: .
      dockerfile: backend/api_gateway/Dockerfile
    container_name: self-heal-api-gateway
    ports:
      - "8010:8000"
    restart: unless-stopped
    depends_on:
      - auth-service

  auth-service:
    build:
      context: .
      dockerfile: backend/auth_service/Dockerfile
    container_name: self-heal-auth-service
    ports:
      - "8001:8000"
    restart: unless-stopped
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your .env file}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your .env file}
    depends_on:
      - db

  db:
    image: postgres:17
    container_name: self-heal-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
