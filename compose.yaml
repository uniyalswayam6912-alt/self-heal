
services:
  api-gateway:
    build:
      context: .
      dockerfile: backend/api_gateway/Dockerfile
    container_name: self-heal-api-gateway
    ports:
      - "8010:8000"
    restart: unless-stopped
    depends_on:
      - auth-service

  auth-service:
    build:
      context: .
      dockerfile: backend/auth_service/Dockerfile
    container_name: self-heal-auth-service
    ports:
      - "8001:8000"
    restart: unless-stopped
